name: Stage ACT checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  stage-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy h5py
      - run: python -m unittest discover -s tests_stages -v
      - run: python build_stage_notebook.py
      - run: python build_stage_deadline_notebook.py
      # Saved Easy/Medium notebooks may contain Colab results; their generators are tested above.
      - run: python medium/code/build_medium_v21_notebook.py
      - run: git diff --exit-code -- notebooks/moveboxes_stages_colab.ipynb notebooks/moveboxes_stage_repair_colab.ipynb
      - run: git diff --exit-code -- notebooks/moveboxes_stage_deadline_colab.ipynb notebooks/moveboxes_stage_runtime_repair.ipynb notebooks/moveboxes_stage_runtime_repair.py
      - run: git diff --exit-code -- notebooks/moveboxes_medium_v21_colab.ipynb
